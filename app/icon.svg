<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-labelledby="title desc">
  <title id="title">Outsourced Assistants logo</title>
  <desc id="desc">A custom assistant concierge and task list mark with a OA wordmark monogram.</desc>
  <defs>
    <linearGradient id="bg" x1="12" y1="10" x2="118" y2="122" gradientUnits="userSpaceOnUse">
      <stop stop-color="#282006"/>
      <stop offset="1" stop-color="#eab308"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#282006" flood-opacity="0.24"/>
    </filter>
  </defs>
  <rect width="128" height="128" rx="34" fill="#fff8ee"/>
  <rect x="8" y="8" width="112" height="112" rx="30" fill="url(#bg)" filter="url(#shadow)"/>
  <g transform="translate(16 8) scale(1)">
  <rect x="26" y="18" width="44" height="58" rx="8" fill="#fff8ee"/>
  <path d="M36 35h24M36 48h18M36 61h24" stroke="#eab308" stroke-width="5" stroke-linecap="round"/>
  <circle cx="70" cy="27" r="9" fill="#9333ea"/>
  <path d="M22 78h52" stroke="#eab308" stroke-width="7" stroke-linecap="round"/>
  </g>
  <rect x="18" y="88" width="92" height="25" rx="12.5" fill="rgba(0,0,0,.24)"/>
  <text x="64" y="106" text-anchor="middle" font-family="Inter, Manrope, Arial, sans-serif" font-size="17" font-weight="900" letter-spacing="-.5" fill="#fff8ee">OA</text>
</svg>
